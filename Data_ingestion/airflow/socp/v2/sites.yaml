# 사이트별 설정 파일
# 새로운 사이트 추가 시 이 파일에 설정만 추가하면 됩니다.

sites:
  baekma:
    # 데이터베이스 설정
    db_conn_id: "baekma_site"
    stats_conn_id: "ess_stats"

    # 테이블 설정
    tables:
      count: "ess_socp_count_oper4"
      count_diff: "ess_socp_count_diff_oper4"
      info: "ess_socp_info_oper4"
      moving_avg: "ess_socp_moving_avg_oper4"

    # 파일 경로 설정
    paths:
      base: "~/airflow/dags/calc_socp/dataset/baekma"
      original: "~/airflow/dags/calc_socp/dataset/baekma/original/"
      count_work: "~/airflow/dags/calc_socp/dataset/baekma/count/work_data/"
      count_prep: "~/airflow/dags/calc_socp/dataset/baekma/count/prep_data/"
      count_diff: "~/airflow/dags/calc_socp/dataset/baekma/count/diff/"
      info_period: "~/airflow/dags/calc_socp/dataset/baekma/info/period_dataset/"
      info_prep: "~/airflow/dags/calc_socp/dataset/baekma/info/prep_dataset/"
      moving_avg: "~/airflow/dags/calc_socp/dataset/baekma/moving_avg/"

    # 사이트별 특수 설정
    cell_count: 240
    file_format: "parquet"
    period: 1

    # 쿼리 설정
    query:
      battery_status_columns:
        - "BATTERY_STATUS_FOR_RUN"
        - "BATTERY_STATUS_FOR_CHARGE"

    # DAG 설정
    dag:
      owner: "jwpark"
      start_date: "2025-11-10"
      schedule_get_dataset: "10 4 * * *"
      catchup: true
      tags:
        - "baekma"
        - "socp"

